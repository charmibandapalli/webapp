name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building DevOps WebApp..."
          test -f index.html
          echo "Build successful!"

      - name: Run tests
        run: |
          echo "Running tests..."
          test -f index.html
          echo "Tests passed!"
